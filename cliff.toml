# git-cliff configuration.
#
# The changelog is derived from Conventional Commits, which this repository
# already writes. Two outputs come from this one file: CHANGELOG.md, and the
# body of each GitHub release. Keeping them on the same template is the point,
# so the release page and the file never drift.
#
# Commits that do not parse as conventional (merge commits, mostly) are dropped
# rather than listed as noise.

[changelog]
header = """
# Changelog

Generated from the Conventional Commits in the git history. Do not edit by
hand: run `uvx git-cliff -o CHANGELOG.md` instead.

"""

body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.breaking %} **[breaking]**{% endif %}
{%- endfor %}
{% endfor %}
"""

footer = ""
trim = true

[git]
conventional_commits = true
# Anything that is not a Conventional Commit is noise in a changelog.
filter_unconventional = true
filter_commits = false
protect_breaking_commits = true
topo_order = false
sort_commits = "oldest"

# Ordered: the first pattern that matches wins. The numeric HTML comments are
# a git-cliff idiom for sorting groups, and are stripped by `striptags` above.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore\\(deps\\)", group = "<!-- 7 -->Dependencies" },
  # Housekeeping that says nothing to a reader of the changelog.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 8 -->Chores" },
]
