[project]
name = "parcelapp-mcp"
dynamic = ["version"]
description = "MCP server for the Parcel delivery tracking app: read and add deliveries over stdio or HTTP"
readme = "README.md"
license = "MIT"
authors = [{ name = "Grégoire Compagnon", email = "obeone@obeone.org" }]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "parcel",
    "parcelapp",
    "delivery-tracking",
    "package-tracking",
    "shipment-tracking",
    "claude",
    "llm-tools",
]
requires-python = ">=3.10"
# No "License :: OSI Approved" classifier on purpose: PEP 639 says the SPDX
# `license` field above replaces it, and mixing the two is an error for some
# build backends.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.1.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/obeone/parcelapp-mcp"
Source = "https://github.com/obeone/parcelapp-mcp"
Issues = "https://github.com/obeone/parcelapp-mcp/issues"
"Upstream API" = "https://parcelapp.net/help/api-view-deliveries.html"

[project.scripts]
parcelapp-mcp = "parcel_mcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag. Two consequences worth
# knowing before you debug a wrong version number:
#   - a shallow clone has no tags, so the build silently produces a dev
#     version. Every checkout that builds this package needs fetch-depth 0.
#   - a build without .git at all fails outright, which is why the Dockerfile
#     passes SETUPTOOLS_SCM_PRETEND_VERSION.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "D",    # pydocstyle: every function carries a doc header
    "ANN",  # annotations on every signature
    "RUF",
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ANN401", # Any is the honest annotation for the cache and the httpx passthrough
]

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation; a docstring would only repeat it. Tests
# that need an explanation carry one anyway, for the "why", not the "what".
"tests/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
strict = true

[[tool.mypy.overrides]]
# The MCP SDK ships types, but its decorators are generic enough that the
# tool functions come back partially untyped. Revisit if that changes.
module = ["mcp.*", "mcp_types.*", "respx.*", "httpx2.*"]
ignore_missing_imports = true
