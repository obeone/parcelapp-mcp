[project]
name = "parcelapp-mcp"
version = "0.1.0"
description = "MCP server for the Parcel delivery tracking API (parcelapp.net)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.0",
    "httpx>=0.27",
]

[project.scripts]
parcelapp-mcp = "parcel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_mcp"]
