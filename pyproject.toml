[project]
name = "parcelapp-mcp"
version = "0.1.0"
description = "MCP server for the Parcel delivery tracking API (parcelapp.net)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Grégoire Compagnon", email = "obeone@obeone.org" }]
keywords = ["mcp", "parcel", "delivery", "tracking"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]
dependencies = [
    "mcp>=2.1.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/obeone/parcelapp-mcp"
Issues = "https://github.com/obeone/parcelapp-mcp/issues"

[project.scripts]
parcelapp-mcp = "parcel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "D",    # pydocstyle: every function carries a doc header
    "ANN",  # annotations on every signature
    "RUF",
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ANN401", # Any is the honest annotation for the cache and the httpx passthrough
]

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation; a docstring would only repeat it. Tests
# that need an explanation carry one anyway, for the "why", not the "what".
"tests/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
strict = true

[[tool.mypy.overrides]]
# The MCP SDK ships types, but its decorators are generic enough that the
# tool functions come back partially untyped. Revisit if that changes.
module = ["mcp.*", "mcp_types.*", "respx.*"]
ignore_missing_imports = true
