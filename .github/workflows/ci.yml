name: CI

on:
  push:
    branches: [main]
  pull_request:

# The test suite mocks the upstream API and needs no credentials: PARCEL_TOKEN
# is set per-test by a fixture. Nothing here ever reaches api.parcel.app, which
# matters because add_delivery is capped at 20 requests per day upstream.

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version from the nearest tag, and uv sync
          # builds the project. A shallow clone has no tags and yields a
          # meaningless 0.1.devN.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version from the nearest tag, and uv sync
          # builds the project. A shallow clone has no tags and yields a
          # meaningless 0.1.devN.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  # Builds the image the release workflow would publish, without pushing it,
  # then runs it until its own HEALTHCHECK (a real MCP handshake) passes. A
  # broken Dockerfile or a dependency bump that breaks the HTTP transport shows
  # up on the pull request instead of on the next tag.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    env:
      # dhi.io refuses anonymous pulls. Dependabot runs only see Dependabot
      # secrets, and fork pull requests see none, so without credentials the
      # build is skipped with a warning rather than failing a check nobody can
      # fix from there. The username falls back to a secret because GitHub does
      # not document whether Dependabot runs can read variables.
      DHI_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DHI_ENABLED: ${{ (vars.DOCKERHUB_USERNAME != '' || secrets.DOCKERHUB_USERNAME != '') && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Explain the skip
        if: env.DHI_ENABLED != 'true'
        run: echo "::warning::No dhi.io credentials in this run (fork or Dependabot pull request?), the image build is skipped."

      - uses: actions/checkout@v7
        if: env.DHI_ENABLED == 'true'

      - uses: docker/setup-buildx-action@v4.3.0
        if: env.DHI_ENABLED == 'true'

      - name: Log in to Docker Hardened Images
        if: env.DHI_ENABLED == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: dhi.io
          username: ${{ env.DHI_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check the Dockerfile
        if: env.DHI_ENABLED == 'true'
        run: docker buildx build --check .

      # amd64 only: loading into the local daemon takes a single platform, and
      # emulating arm64 would cost minutes on every pull request for a
      # pure-Python image. The release workflow still builds both.
      - name: Build
        if: env.DHI_ENABLED == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: parcelapp-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run until healthy
        if: env.DHI_ENABLED == 'true'
        run: |
          docker run -d --name parcelapp-mcp parcelapp-mcp:ci
          # start-period 10s plus three 30s intervals is the worst case before
          # Docker itself gives up, so two minutes covers it.
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' parcelapp-mcp)
            [ "$status" = starting ] || break
            sleep 2
          done
          echo "Health: $status"
          if [ "$status" != healthy ]; then
            docker logs parcelapp-mcp
            exit 1
          fi
